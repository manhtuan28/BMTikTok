name: Build BMTikTok IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Đường link tải file TikTok IPA gốc (Google Drive, Direct Link, Dropbox...)'
        required: true
        type: string
        default: 'https://drive.google.com/file/d/1y-FAp-OfRpC5LC46G6eu3maw5CF-KRv8/view?usp=drive_link'
      tiktok_version:
        description: 'Phiên bản TikTok (Ví dụ: 46.5.0)'
        required: false
        default: '46.5.0'
        type: string
      create_release:
        description: 'Tạo GitHub Release để tải trực tiếp từ tab Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    name: Build & Inject BMTikTok IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 🛠️ Cài Đặt Theos & iOS SDK
        run: |
          echo "Cloning Theos..."
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          echo "Downloading iOS SDKs..."
          git clone --depth 1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: ⚙️ Biên Dịch BMTikTok Tweak (Dylib & Deb)
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1
          
          # Tìm file dylib sau khi build
          DYLIB_PATH=$(find .theos/obj -name "BMTikTok.dylib" | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            DYLIB_PATH=$(find . -name "BMTikTok.dylib" | head -n 1)
          fi
          echo "DYLIB_PATH=$DYLIB_PATH" >> $GITHUB_ENV
          echo "✅ Đã build thành công: $DYLIB_PATH"

      - name: 📦 Tải File TikTok IPA Gốc
        run: |
          python3 tools/download_ipa.py -u "${{ inputs.ipa_url }}" -o input_tiktok.ipa
          
          if [ ! -f "input_tiktok.ipa" ] || [ ! -s "input_tiktok.ipa" ]; then
            echo "❌ Lỗi: Không thể tải file IPA gốc!"
            exit 1
          fi

      - name: 💉 Chèn BMTikTok Vào TikTok IPA
        run: |
          OUTPUT_IPA="BMTikTok_${{ inputs.tiktok_version }}.ipa"
          python3 tools/inject_ipa.py -i input_tiktok.ipa -d "$DYLIB_PATH" -b BMTikTok.bundle -o "$OUTPUT_IPA"
          echo "OUTPUT_IPA=$OUTPUT_IPA" >> $GITHUB_ENV

      - name: 📤 Upload Artifact (File IPA & DEB)
        uses: actions/upload-artifact@v4
        with:
          name: BMTikTok-${{ inputs.tiktok_version }}
          path: |
            ${{ env.OUTPUT_IPA }}
            packages/*.deb

      - name: 🚀 Tạo GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.tiktok_version }}-${{ github.run_number }}
          name: BMTikTok v${{ inputs.tiktok_version }}
          body: |
            ## 🌟 BMTikTok - Bản Mod TikTok iOS Tối Thượng
            * **Phiên bản TikTok:** ${{ inputs.tiktok_version }}
            * **Tác giả:** Tuancute28 (Bùi Mạnh Tuấn)
            * **Ngày phát hành:** ${{ github.event.head_commit.timestamp }}
            
            ### ✨ Hướng Dẫn Cài Đặt
            1. Tải file `.ipa` đính kèm bên dưới.
            2. Cài đặt trực tiếp qua **TrollStore**, **Sideloadly**, **AltStore**, hoặc **Esign**.
            3. Mở ứng dụng và tận hưởng toàn bộ các tính năng cao cấp!
          files: |
            ${{ env.OUTPUT_IPA }}
            packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
